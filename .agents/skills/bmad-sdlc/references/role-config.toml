# Role-Based SDLC Configuration
# Each role defines the actions it owns and the reference directory to load.
# Actions are matched by prefix (longest prefix wins).

[roles.pm]
name = "Product Manager"
actions = ["frame.brainstorm", "frame.forge", "frame.research", "frame.brief", "frame.prfaq", "frame.spec", "plan.prd", "plan.ux", "plan.architecture", "plan.stories", "plan.sprint"]
references = ["references/pm/"]
phases = ["plan"]

[roles.dev]
name = "Developer"
actions = ["build.atdd", "build.ticket", "build.auto", "build.loop", "build.tests", "build.review", "build.done"]
# Note: build.review and build.done are also in QA for code review, but DEV owns the build flow
references = ["references/dev/"]
phases = ["build"]

[roles.qa]
name = "Quality"
actions = ["solution.test_design", "solution.framework", "solution.ci", "verify.e2e", "verify.automate", "verify.test_review", "verify.nfr", "verify.trace", "close.walkthrough", "close.retro", "close.correct_course", "close.mark_done"]
references = ["references/qa/"]
phases = ["verify", "close"]

# Phase-to-role mapping for auto-detection
[phase_roles]
plan = "pm"
solution = "pm"  # PM owns solution setup, but can hand to test-architect for v6
build = "dev"
verify = "qa"
close = "qa"

# Action-to-role lookup (prefix match, longest wins)
# Generated from above action lists
[[role_action_map]]
role = "pm"
action_prefix = "frame."

[[role_action_map]]
role = "pm"
action_prefix = "plan."

[[role_action_map]]
role = "dev"
action_prefix = "build."

[[role_action_map]]
role = "qa"
action_prefix = "solution."

[[role_action_map]]
role = "qa"
action_prefix = "verify."

[[role_action_map]]
role = "qa"
action_prefix = "close."